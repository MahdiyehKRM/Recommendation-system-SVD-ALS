<table>
  <thead>
    <tr>
      <th>user_id</th>
      <th>product_id</th>
      <th>امتیاز واقعی</th>
      <th>پیش‌بینی مدل</th>
    </tr>
  </thead>
  <tbody>
    {% for r in result.sample %}
    <tr>
      <td style="font-family:monospace;font-size:11px">{{ r.user_id|slice:":14" }}</td>
      <td style="font-family:monospace;font-size:11px">{{ r.product_id }}</td>
      <td>{{ r.actual }}</td>
      <td style="color:var(--purple)">{{ r.predicted }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
